# This dedicated log intentionally omits source addresses, request targets,
# query strings, referrers, and response sizes. The monitor needs only enough
# data to count status families and exclude its own synthetic user agent.
log_format pitchai_service_monitoring escape=json
  '{"timestamp":"$time_iso8601",'
  '"status":$status,'
  '"host":"$host",'
  '"user_agent":"$http_user_agent"}';

access_log /var/log/nginx/service-monitoring-access.log pitchai_service_monitoring
  if=$pitchai_service_monitoring_alertable;
