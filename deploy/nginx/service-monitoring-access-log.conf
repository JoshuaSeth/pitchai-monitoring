# Known hosts excluded from the global production reverse-proxy SLO.
# Keep this map aligned with environment and alert policy in domain_checks/config.yaml.
# Unknown hosts stay included so newly introduced production routes fail loud.
map $host $pitchai_service_monitoring_production {
  hostnames;
  default 1;
  staging.chat.pitchai.net 0;
  auth.pitchai.net 0;
  tools.pitchai.net 0;
  dispatch.pitchai.net 0;
  whatsapp.pitchai.net 0;
  servers.pitchai.net 0;
  suggestions.pitchai.net 0;
  filedrop.pitchai.net 0;
  codex-voice.pitchai.net 0;
  codexusage.pitchai.net 0;
  codex-cowork.pitchai.net 0;
  monitoring.pitchai.net 0;
  breakglass.pitchai.net 0;
  wiki.pitchai.net 0;
  privacy-gateway-staging.pitchai.net 0;
  storage.pitchai.net 0;
  onboarding-course.pitchai.net 0;
  registry.pitchai.net 0;
  agentcloud.pitchai.net 0;
  dashboards.pitchai.net 0;
  support.pitchai.net 0;
  demo.afasask.pitchai.net 0;
  staging.afasask.pitchai.net 0;
  staging.autopar.pitchai.net 0;
  autopar-staging-web.37.27.67.52.nip.io 0;
  staging.formatief-toetsen.pitchai.net 0;
  dft-marketing-staging.pitchai.net 0;
  staging.potaito.pitchai.net 0;
  theplanbook.pitchai.net 0;
  staging.hetcis.pitchai.net 0;
  cursussen.pitchai.net 0;
  aigenda-rules.demos.pitchai.net 0;
  digibeat.demos.pitchai.net 0;
  studentenreisproduct.demos.pitchai.net 0;
  apologetica-wagtail-staging.pitchai.net 0;
  aigenda-monitor.pitchai.net 0;
  jeff-codex-voice.pitchai.net 0;
  jeff-dispatch.pitchai.net 0;
  jeff-work-inbox.pitchai.net 0;
}

# This dedicated log intentionally omits source addresses, request targets,
# query strings, referrers, and response sizes. The monitor needs only enough
# data to count status families and exclude its own synthetic user agent.
log_format pitchai_service_monitoring escape=json
  '{"timestamp":"$time_iso8601",'
  '"status":$status,'
  '"host":"$host",'
  '"user_agent":"$http_user_agent"}';

access_log /var/log/nginx/service-monitoring-access.log pitchai_service_monitoring
  if=$pitchai_service_monitoring_production;
