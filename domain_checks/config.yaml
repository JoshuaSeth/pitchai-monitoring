interval_seconds: 60
# Limits overall parallelism across domains (HTTP + browser). Helps avoid false positives during load spikes.
check_concurrency: 25
browser_concurrency: 4

# Reduce noise from transient network/browser hiccups:
# - Mark a domain DOWN only after N consecutive failing cycles.
# - Mark it back UP only after M consecutive successful cycles (prevents flap spam).
alerting:
  down_after_failures: 2
  up_after_successes: 2

# Proactive host health checks (runs on the same host as the monitor container).
# These do NOT mark any domain down; they produce separate warnings + optional dispatcher triage.
host_health:
  enabled: true
  # Debounce host health warnings to avoid spam.
  down_after_failures: 3
  up_after_successes: 2
  # Thresholds (>= triggers "degraded").
  disk_used_percent_max: 80
  mem_used_percent_max: 80
  swap_used_percent_max: 80
  cpu_used_percent_max: 80
  # Optional: warn when load1 per CPU exceeds this value (set null to disable).
  load1_per_cpu_max: 2.0
  # Paths to evaluate disk usage on (first existing path wins for reporting).
  disk_paths:
    - /
    - /data
  dispatch_on_degraded: true
  notify_on_recovery: false

# Proactive performance checks: alert if response times are consistently slow.
# These do NOT mark any domain down; they produce separate warnings + optional dispatcher triage.
performance:
  enabled: true
  down_after_failures: 3
  up_after_successes: 2
  http_elapsed_ms_max: 1500
  browser_elapsed_ms_max: 4000
  dispatch_on_degraded: true
  notify_on_recovery: false

# Rolling history retained on disk for SLO/RED calculations.
history:
  retention_days: 14

# SLO + error budget burn-rate monitoring (based on monitor observations).
slo:
  enabled: true
  target_percent: 99.9
  down_after_failures: 3
  up_after_successes: 2
  # Multi-window burn-rate rules (burn rate is normalized by the error budget).
  burn_rate_rules:
    - name: page_fast_burn
      short_window_minutes: 5
      long_window_minutes: 60
      short_burn_rate: 14.4
      long_burn_rate: 6.0
    - name: ticket_slow_burn
      short_window_minutes: 360
      long_window_minutes: 4320  # 3 days
      short_burn_rate: 6.0
      long_burn_rate: 1.0
  dispatch_on_degraded: true
  notify_on_recovery: false

# TLS certificate monitoring (expiry / handshake failures).
tls:
  enabled: true
  interval_minutes: 60
  min_days_valid: 14
  timeout_seconds: 8
  down_after_failures: 2
  up_after_successes: 1
  dispatch_on_degraded: true
  notify_on_recovery: false

# DNS monitoring (A/AAAA resolution + optional drift detection).
dns:
  enabled: true
  interval_minutes: 15
  timeout_seconds: 4
  resolvers:
    - "1.1.1.1"
    - "8.8.8.8"
  require_ipv4: true
  require_ipv6: false
  alert_on_drift: false
  down_after_failures: 2
  up_after_successes: 1
  dispatch_on_degraded: true
  notify_on_recovery: false

# RED / golden signals (error-rate + latency percentiles over a rolling window).
red:
  enabled: true
  window_minutes: 30
  min_samples: 10
  error_rate_max_percent: 5.0
  http_p95_ms_max: 2000
  browser_p95_ms_max: 7000
  down_after_failures: 3
  up_after_successes: 2
  dispatch_on_degraded: true
  notify_on_recovery: false

# API contract checks (per-domain definitions live in each domain's check.py).
api_contract:
  enabled: true
  interval_minutes: 5
  timeout_seconds: 10
  down_after_failures: 2
  up_after_successes: 2
  dispatch_on_degraded: true
  notify_on_recovery: false

# End-to-end synthetic transactions (per-domain definitions live in each domain's check.py).
synthetic:
  enabled: true
  interval_minutes: 15
  max_domains_per_cycle: 1
  timeout_seconds: 35
  down_after_failures: 2
  up_after_successes: 2
  dispatch_on_degraded: true
  notify_on_recovery: false

# Core Web Vitals (LCP/CLS/INP approximation) via Playwright.
web_vitals:
  enabled: true
  interval_minutes: 60
  max_domains_per_cycle: 1
  timeout_seconds: 45
  post_load_wait_ms: 4500
  lcp_ms_max: 4500
  cls_max: 0.25
  inp_ms_max: 500
  down_after_failures: 2
  up_after_successes: 2
  dispatch_on_degraded: true
  notify_on_recovery: false

# Docker container health monitoring (requires mounting /var/run/docker.sock into the monitor container).
container_health:
  enabled: true
  interval_minutes: 1
  docker_socket_path: /var/run/docker.sock
  monitor_all: false
  include_name_patterns:
    - "^service-monitoring$"
    - "^database-dependency-monitor$"
    - "^e2e-registry$"
    - "^e2e-runner$"
    - "^registry$"
    - "^afasask$"
    - "^afasask-demo$"
    - "^afasask-quick-chat(?:-staging)?$"
    - "^afas-sync$"
    - "^pgbouncer-(?:afasask|autopar|potaito)$"
    - "^autopar$"
    - "^autopar-auth$"
    - "^autopar-staging-(?:web|db)$"
    - "^aigenda-webapp(?:-monitor)?$"
    - "^codex-cowork-webapp$"
    - "^apologetica-wagtail-staging(?:-db)?$"
    - "^potaito-web-harvest$"
    - "^potai-staging$"
    - "^aipc-(?:skybuyfly-(?:primary|backup)|crawler|match-dependent-ops|product-image-refresher|qdrant-sync|search-derived-fields|meilisync)$"
    - "^(?:qdrant|meilisearch|pgbouncer-aipc)$"
    - "^skybuyfly-quick-chat$"
    - "^deplanbook-play(?:-blue|-green)?$"
    - "^deplanbook-cms$"
    - "^deplanbook-(?:libretranslate|db-proxy)$"
    - "^pgbouncer-deplanbook$"
    - "^twofa-server-prod$"
    - "^dft-web-app(?:-green|-staging|-staging-spend-enabled)?$"
    - "^staging-temp-web$"
    - "^dft-worker(?:-green|-staging|-staging-spend-enabled)?$"
    - "^dft-batch-progress-redis(?:-main-candidate|-staging|-staging-spend-enabled|-staging-temp-bas)?$"
    - "^dft-llm-mock-openai-staging$"
    - "^meilisearch-formatief-toetsen$"
    - "^meilisync-formatief-toetsen(?:-staging)?$"
    - "^pgbouncer-dft(?:-staging)?$"
    - "^orthoparse-(?:web-app(?:-green)?|ceph-worker|worker(?:-green)?)$"
    - "^pgbouncer-orthoparse$"
    - "^pitchai-onboarding-course-onboarding-course-1$"
    - "^pitchai-breakglass-web-terminal$"
    - "^quickchat-rsr-demo$"
  exclude_name_patterns: []
  timeout_seconds: 3
  down_after_failures: 2
  up_after_successes: 1
  dispatch_on_degraded: true
  notify_on_recovery: false

# First-class database dependency monitoring. The sidecar executes one bounded,
# read-only probe inside each database-backed production app container so the
# exact runtime credential and network/PgBouncer path are exercised. It never
# copies DSNs, passwords, query results, or raw container environment values into
# monitoring state or logs.
database_dependencies:
  enabled: true
  interval_seconds: 300
  timeout_seconds: 12
  down_after_failures: 2
  up_after_successes: 2
  max_parallel_probes: 4
  docker_socket_path: /var/run/docker.sock
  state_path: /data/database-dependencies.json
  python_executable: python
  environment_key_patterns:
    - '^(?:[A-Z0-9]+_)*(?:DATABASE|DB)(?:_[A-Z0-9]+)*(?:_URL|_URI|_DSN|_PATH)$'
  environment_key_exclude_patterns:
    - '(?:ADMIN|ALEMBIC|DIRECT|MIGRATION|SHADOW|STAGING|TEST)'
  exclude_name_patterns:
    - '^service-monitoring$'
    - '^database-dependency-monitor$'
    - '(^|[-_])(?:demo|deprecated|rehearsal|rollback|staging|test)(?:[-_]|$)'
    - '^(?:postgres|pgbouncer|redis|qdrant|meilisearch|libretranslate)(?:[-_].*)?$'
    - '^(?:apologetica-wagtail-staging|potai-staging)$'
  routing_policies:
    - id: dft-blue-green
      kind: http_header
      source: https://formatief-toetsen.pitchai.net/healthz
      header_name: X-DFT-Blue-Green
      slots: [blue, green]
    - id: orthoparse-blue-green
      kind: http_header
      source: https://orthoparse.pitchai.net/healthz
      header_name: X-Orthoparse-Blue-Green
      slots: [blue, green]
    - id: deplanbook-blue-green
      kind: nginx_upstream_file
      source: /routing/nginx-conf/deplanbook-play-upstream.conf
      slots: [legacy, blue, green]
      slot_ports: {legacy: 3140, blue: 13140, green: 13141}
  rules:
    - id: autopar-primary
      container_pattern: '^autopar$'
      app_name: AutoPAR
      owner_project: AutoPAR
      database_label: Production PostgreSQL via AutoPAR runtime/PgBouncer
      environment: production
      critical: true
      telegram_enabled: true
      required_group: autopar-primary
      domains: [autopar.pitchai.net]
      connection_mode: engine
      environment_keys: []
      file_environment_keys: []
      engine_attr: web_app.db:sync_engine
      engine_callable: false
      schema_checks: [public]
      relation_checks:
        - caseanalysisstate
        - meditlinkcase
        - meditlinkuser
        - overjet_details
        - serverstate
        - patient_longitudinal_pairs
        - dashboard_overview_case_facts
        - dashboard_overview_pair_candidates
        - dashboard_policy_trajectory_denominator
      alert_group: autopar-production-database
      likely_fix_path: Restore LOGIN/password on the AutoPAR runtime role, then restore AutoPAR schema/table/materialized-view grants and verify the PgBouncer route.
    - id: autopar-auth
      container_pattern: '^autopar-auth$'
      app_name: AutoPAR authentication
      owner_project: AutoPAR
      database_label: Production PostgreSQL via AutoPAR auth runtime
      environment: production
      critical: true
      telegram_enabled: true
      required_group: autopar-auth
      domains: [auth.autopar.pitchai.net, autopar.pitchai.net]
      connection_mode: engine
      environment_keys: []
      file_environment_keys: []
      engine_attr: web_app.db:sync_engine
      engine_callable: false
      schema_checks: [public]
      relation_checks: [meditlinkuser]
      alert_group: autopar-production-database
      likely_fix_path: Restore the AutoPAR auth runtime role LOGIN/password and SELECT grant, then verify its mounted runtime config and PgBouncer path.
    - id: autopar-dashboard-refresh
      container_pattern: '^autopar-dashboard-mv-refresh$'
      app_name: AutoPAR dashboard refresh
      owner_project: AutoPAR
      database_label: AutoPAR dashboard materialized-view chain
      environment: production
      critical: false
      telegram_enabled: false
      domains: [autopar.pitchai.net]
      connection_mode: engine
      environment_keys: []
      file_environment_keys: []
      engine_attr: web_app.db:sync_engine
      engine_callable: false
      schema_checks: [public]
      relation_checks:
        - patient_longitudinal_pairs
        - dashboard_overview_case_facts
        - dashboard_overview_pair_candidates
        - dashboard_policy_trajectory_denominator
      alert_group: autopar-dashboard-refresh
      likely_fix_path: Restore runtime-role read grants and the refresher role's materialized-view refresh grants; then run the AutoPAR dashboard runtime verifier.
    - id: autopar-production-worker
      container_pattern: '^autopar-'
