# Reverse proxy / failover monitoring (uses upstream headers + optional Nginx logs).
proxy:
  enabled: true
  access_log_path: /var/log/nginx/service-monitoring-access.log
  error_log_path: /var/log/nginx/error.log
  timezone: "Europe/Amsterdam"
  window_seconds: 300
  access_log_max_bytes: 1000000
  error_log_max_bytes: 1000000
  min_total_requests: 50
  max_502_504_percent: 1.0
  max_upstream_errors_per_domain: 5
  down_after_failures: 2
  up_after_successes: 2
  dispatch_on_degraded: true
  notify_on_recovery: false

# Meta-monitoring: alert when the monitor itself can't keep up or can't persist state.
meta_monitoring:
  enabled: true
  cycle_overrun_factor: 1.25
  state_write_failures_max: 3
  down_after_failures: 2
  up_after_successes: 2
  dispatch_on_degraded: true
  notify_on_recovery: false

# Twice-daily heartbeat messages to confirm the monitor is alive and to report
# per-domain response times from that check cycle.
heartbeat:
  enabled: true
  timezone: "Europe/Amsterdam"
  times:
    - "07:30"
    - "12:00"

# Optional: include externally-registered StepFlow E2E tests in heartbeats.
# This fetches `GET {E2E_REGISTRY_BASE_URL}/api/v1/status/summary` using a bearer token.
external_e2e:
  enabled: true
  # Prefer env var override: E2E_REGISTRY_BASE_URL
  base_url: "http://e2e-registry:8111"
  # Prefer env var override: E2E_REGISTRY_MONITOR_TOKEN (or E2E_REGISTRY_ADMIN_TOKEN)
  monitor_token: ""
  timeout_seconds: 8

# Reviewed domain inventory. This is the single source consumed by the minute
# monitor, DNS/TLS checks, dashboard service health, incidents, and E2E views.
inventory:
  version: 1
  reviewed_at: "2026-08-30"
  authoritative_sources:
    - "domain-engineer-namecheap-dns live authoritative sweep (2026-08-27)"
    - "Namecheap snapshot 20260827T211642Z-d7dbcb644f38-af90dc1d: 72 records, no wildcard, SHA-256 d7dbcb644f38136f38e276c4b19e75c0f742f0637578bac28d67c17fb9186102"
    - "pitchai-main, pitchai-dev, file-storage, Jeff, AX41 and DFT ingress/runtime"
    - "last-nine-day live-agent, PM DB, repository and deployment evidence sweep"
    - "current production monitoring routes and deep-check plugins"
    - "PitchAI live-agent/app-server registry and tools portal routing"
    - "live public DNS, TLS, HTTP and container/service contract probes (2026-08-27)"
    - "known client deployment zones"
    - "Unimix repair confirmation and live public DNS, TLS and HTTP probes (2026-08-27)"
    - "formatiefleren.nl Namecheap DNS activation and production deployment handoff (2026-08-28)"
    - "last-nine-day live-agent, PM DB, repository and deployment evidence sweep (2026-08-30)"
    - "live public DNS, TLS and HTTP contract probes (2026-08-30)"

