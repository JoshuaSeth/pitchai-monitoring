name: Python strict gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-strict-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Enforcement integrity
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify the anti-bypass trust anchor
        shell: bash
        run: |
          set -euo pipefail
          verifier_path="quality/pitchai_quality/check_no_validation_bypasses.py"
          expected_verifier_sha256="3b0d7ead6d8dad6a41f8830a4fb56cf4640b3400a6a66bb948d4244b7f7870a6"
          actual_verifier_sha256="$(sha256sum "$verifier_path" | awk '{print $1}')"
          if [[ "$actual_verifier_sha256" != "$expected_verifier_sha256" ]]; then
            printf '%s: SHA-256 trust anchor mismatch (expected %s, got %s)\n' \
              "$verifier_path" "$expected_verifier_sha256" "$actual_verifier_sha256" >&2
            exit 1
          fi

      - name: Capture the original main push range
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_REF: ${{ github.ref }}
          PUSH_REPOSITORY: ${{ github.repository }}
          STRICT_RUN_ATTEMPT: ${{ github.run_attempt }}
          STRICT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ || ! "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid push range in the GitHub event payload" >&2
            exit 1
          fi
          if [[ "$PUSH_REF" != "refs/heads/main" || -z "$PUSH_REPOSITORY" ]]; then
            echo "Invalid main push provenance" >&2
            exit 1
          fi
          if [[ ! "$STRICT_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$STRICT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid strict-run identity" >&2
            exit 1
          fi
          jq --null-input \
            --arg after "$AFTER_SHA" \
            --arg before "$BEFORE_SHA" \
            --arg event "push" \
            --arg ref "$PUSH_REF" \
            --arg repository "$PUSH_REPOSITORY" \
            --arg run_attempt "$STRICT_RUN_ATTEMPT" \
            --arg run_id "$STRICT_RUN_ID" \
            '{schema: 1, event: $event, ref: $ref, repository: $repository,
              before: $before, after: $after, run_id: $run_id, run_attempt: $run_attempt}' \
            >"$RUNNER_TEMP/release-provenance.json"

      - name: Preserve the original main push range
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-release-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-provenance.json
          if-no-files-found: error
          retention-days: 30

  ratchet:
    name: Quality ratchet
    needs: integrity
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.10.0"
          python-version: "3.12.12"
          enable-cache: true

      - name: Verify ratchet unit contracts
        run: uv run --project quality --python 3.12.12 --frozen python -m unittest quality.tests.test_ratchet

      - name: Reject every new or moved Python violation
        run: >-
          uv run --project quality --python 3.12.12 --frozen ratchet verify
          --baseline quality/baselines/python-strict-activation-f4b541b.json
          --base github-event
          --candidate-report quality-ratchet-candidate.json

      - name: Preserve the complete candidate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-quality-ratchet-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-ratchet-candidate.json
          if-no-files-found: error
          retention-days: 30

  check:
    name: Full zero-debt gate
    needs: integrity
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.10.0"
          python-version: "3.12.12"
          enable-cache: true

      - name: Install the locked quality environment
        run: uv sync --project quality --python 3.12.12 --frozen

      - name: Run every fail-closed Python gate
        run: uv run --project quality --python 3.12.12 --frozen check
