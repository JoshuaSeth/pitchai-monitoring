name: Service Monitoring Deploy

on:
  push:
    branches: [main]
    # Avoid auto-deploys when only workflow or documentation files change.
    paths-ignore:
      - ".github/workflows/**"
      - ".semgrep.yml"
      - ".semgrepignore"
      - "docs/**"
      - "pyproject.toml"
      - "README.md"
      - "scripts/**"
      - "uv.lock"
  workflow_dispatch: {}

concurrency:
  group: service-monitoring-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      # Self-hosted runner + dockerized pytest: the container runs as root and can leave
      # behind root-owned files in the workspace (e.g. `.pytest_cache`), which then
      # breaks the next `actions/checkout` clean step. Pre-clean with sudo to keep
      # the runner from getting stuck.
      - name: Pre-clean workspace (avoid root-owned leftovers)
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* || true

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build test image
        run: docker build -t service-monitoring:ci .

      - name: Verify production image monitoring runtime
        run: |
          docker run --rm service-monitoring:ci \
            python -c "from e2e_registry.monitoring_v2_runtime import install_monitoring_v2, production_registry_app; assert callable(install_monitoring_v2); assert callable(production_registry_app)"

      - name: Verify live dashboard proof script syntax
        run: node --check scripts/verify-live-dashboard.cjs

      - name: Run tests (HTTP + Playwright UI)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            service-monitoring:ci \
            sh -lc "pip install --no-cache-dir -r requirements-dev.txt && python -m pytest -o cache_dir=/tmp/pytest_cache"

  deploy-prod:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - name: Deploy to production (SSH + Docker)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            APP_NAME="service-monitoring"
            OLD_NAME="monitoring"
            REGISTRY_NAME="e2e-registry"
            RUNNER_NAME="e2e-runner"
            DB_MONITOR_NAME="database-dependency-monitor"
            DOMAIN_EVENT_NAME="domain-incident-events"
            SCHEDULER_OBSERVER_NAME="scheduler-placement-observer"
            NET_NAME="pitchai-shared"
            IMAGE_SHA="service-monitoring:${{ github.sha }}"
            IMAGE_LATEST="service-monitoring:latest"
            EVENT_BUS_SECRET="${{ secrets.PITCHAI_MONITORING_EVENT_BUS_SECRET }}"

            if [[ "${#EVENT_BUS_SECRET}" -lt 32 ]]; then
              echo "Missing or invalid PITCHAI_MONITORING_EVENT_BUS_SECRET"
              exit 1
            fi

            echo "🚀 Deploying ${APP_NAME} + ${REGISTRY_NAME} + ${RUNNER_NAME} + ${DB_MONITOR_NAME} + ${DOMAIN_EVENT_NAME} + ${SCHEDULER_OBSERVER_NAME} @ ${{ github.sha }}"

            DEPLOY_DIR="/tmp/${APP_NAME}-deploy-${{ github.run_id }}-${{ github.run_attempt }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "📥 Cloning repo..."
            git clone https://github.com/JoshuaSeth/pitchai-monitoring.git .
            git checkout ${{ github.sha }}

            echo "🧭 Installing host-aware monitoring access log..."
            MONITORING_NGINX_SOURCE="deploy/nginx/service-monitoring-access-log.conf"
            MONITORING_NGINX_TARGET="/etc/nginx/conf.d/service-monitoring-access-log.conf"
            MONITORING_NGINX_BACKUP="$DEPLOY_DIR/service-monitoring-access-log.conf.previous"
            monitoring_nginx_had_previous="false"
            if [[ -f "$MONITORING_NGINX_TARGET" ]]; then
              cp -a "$MONITORING_NGINX_TARGET" "$MONITORING_NGINX_BACKUP"
              monitoring_nginx_had_previous="true"
            fi
            restore_monitoring_nginx() {
              if [[ "$monitoring_nginx_had_previous" == "true" ]]; then
                install -o root -g root -m 0644 "$MONITORING_NGINX_BACKUP" "$MONITORING_NGINX_TARGET"
              else
                rm -f -- "$MONITORING_NGINX_TARGET"
              fi
            }
            install -o root -g root -m 0644 "$MONITORING_NGINX_SOURCE" "$MONITORING_NGINX_TARGET"
            if ! nginx -t; then
              restore_monitoring_nginx
              nginx -t
              exit 1
            fi
            if ! systemctl reload nginx; then
              restore_monitoring_nginx
              nginx -t
              systemctl reload nginx || true
              exit 1
            fi

            echo "🌐 Ensuring docker network exists: $NET_NAME"
            if ! docker network ls --format '{{.Name}}' | grep -qx "$NET_NAME"; then
              docker network create "$NET_NAME" >/dev/null
            fi

            stop_rm_if_exists() {
              local name="$1"
              if docker ps -a --format '{{.Names}}' | grep -qx "$name"; then
                echo "🛑 Stopping existing container: $name"
                docker stop "$name" || true
                docker rm "$name" || true
              fi
            }

            echo "🔨 Building image..."
            docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .

            echo "🔎 Preflighting scheduler observer profile with the runtime parser..."
            SCHEDULER_OBSERVER_PROFILE="/etc/pitchai-cli-new/platform-user-thomas.env"
            if [[ ! -r "$SCHEDULER_OBSERVER_PROFILE" ]]; then
              echo "❌ Missing readable scheduler observer profile: $SCHEDULER_OBSERVER_PROFILE"
              exit 1
            fi
            set -a
            # The installed profile follows shell EnvironmentFile syntax. Source
            # it once so Docker receives the exact normalized values.
            # shellcheck disable=SC1090
            . "$SCHEDULER_OBSERVER_PROFILE"
            set +a
            docker run --rm \
              --network host \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=1m \
              -e PITCHAI_PLATFORM_CENTRAL_URL \
              -e PITCHAI_PLATFORM_USER_TOKEN \
              -e PYTHONDONTWRITEBYTECODE="1" \
              "$IMAGE_SHA" \
              python -c 'from monitoring_v2.scheduler_cell_directory import read_scheduler_cell_directory; from monitoring_v2.scheduler_incident_feed import load_scheduler_incident_feed_config; read_scheduler_cell_directory(load_scheduler_incident_feed_config())'

            echo "📦 Ensuring volumes exist..."
            docker volume create service-monitoring-state >/dev/null
            docker volume create e2e-registry-data >/dev/null
            docker volume create e2e-artifacts >/dev/null

            echo "🔐 Ensuring E2E registry tokens exist..."
            SECRETS_DIR="${HOME}/service-monitoring"
            mkdir -p "$SECRETS_DIR"
            E2E_ENV_FILE="$SECRETS_DIR/e2e-registry.env"
            if [[ ! -f "$E2E_ENV_FILE" ]]; then
              echo "Generating new E2E registry tokens at $E2E_ENV_FILE"
              admin="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              monitor="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              runner="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              hotpath="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              {
                echo "E2E_REGISTRY_ADMIN_TOKEN=${admin}"
                echo "E2E_REGISTRY_MONITOR_TOKEN=${monitor}"
                echo "E2E_REGISTRY_RUNNER_TOKEN=${runner}"
                echo "E2E_HOTPATH_REPORTER_TOKEN=${hotpath}"
                echo "E2E_REGISTRY_DB_PATH=/data/e2e-registry.db"
                echo "E2E_ARTIFACTS_DIR=/artifacts"
                echo "E2E_TESTS_DIR=/data/e2e-tests"
                echo "E2E_REGISTRY_ALERTS_ENABLED=1"
                echo "E2E_REGISTRY_DISPATCH_ENABLED=0"
                echo "E2E_REGISTRY_STRICT_BASE_URL_POLICY=1"
                echo "E2E_REGISTRY_ALLOW_MONITORED_DOMAINS=1"
              } >"$E2E_ENV_FILE"
              chmod 600 "$E2E_ENV_FILE" || true
            fi
            # Backfill new required settings into an existing env file.
            if ! grep -qE '^E2E_TESTS_DIR=' "$E2E_ENV_FILE"; then
              echo "E2E_TESTS_DIR=/data/e2e-tests" >>"$E2E_ENV_FILE"
            fi
            if ! grep -qE '^E2E_REGISTRY_STRICT_BASE_URL_POLICY=' "$E2E_ENV_FILE"; then
              echo "E2E_REGISTRY_STRICT_BASE_URL_POLICY=1" >>"$E2E_ENV_FILE"
            fi
            if ! grep -qE '^E2E_REGISTRY_ALLOW_MONITORED_DOMAINS=' "$E2E_ENV_FILE"; then
              echo "E2E_REGISTRY_ALLOW_MONITORED_DOMAINS=1" >>"$E2E_ENV_FILE"
            fi
            # Converge hosts created by older deployments.  Leaving this set to
            # 1 is misleading now that the Dispatcher endpoint has been retired.
            if grep -qE '^E2E_REGISTRY_DISPATCH_ENABLED=' "$E2E_ENV_FILE"; then
              sed -i 's/^E2E_REGISTRY_DISPATCH_ENABLED=.*/E2E_REGISTRY_DISPATCH_ENABLED=0/' "$E2E_ENV_FILE"
            else
              echo "E2E_REGISTRY_DISPATCH_ENABLED=0" >>"$E2E_ENV_FILE"
            fi
            if ! grep -qE '^E2E_HOTPATH_REPORTER_TOKEN=' "$E2E_ENV_FILE"; then
              hotpath="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              echo "E2E_HOTPATH_REPORTER_TOKEN=${hotpath}" >>"$E2E_ENV_FILE"
            fi
            chmod 600 "$E2E_ENV_FILE"
            E2E_MONITOR_TOKEN="$(grep -E '^E2E_REGISTRY_MONITOR_TOKEN=' "$E2E_ENV_FILE" | head -n1 | cut -d= -f2-)"
            if [[ -z "${E2E_MONITOR_TOKEN}" ]]; then
              echo "❌ Missing E2E_REGISTRY_MONITOR_TOKEN in $E2E_ENV_FILE"
              exit 1
            fi
            E2E_HOTPATH_REPORTER_TOKEN="$(grep -E '^E2E_HOTPATH_REPORTER_TOKEN=' "$E2E_ENV_FILE" | head -n1 | cut -d= -f2-)"
            if [[ "${#E2E_HOTPATH_REPORTER_TOKEN}" -lt 32 ]]; then
              echo "❌ Missing or invalid E2E_HOTPATH_REPORTER_TOKEN in $E2E_ENV_FILE"
              exit 1
            fi
            HOTPATH_REPORTER_TOKEN_FILE="$SECRETS_DIR/hotpath-reporter.token"
            hotpath_token_tmp="$(mktemp "$SECRETS_DIR/.hotpath-reporter.token.XXXXXX")"
            printf '%s\n' "$E2E_HOTPATH_REPORTER_TOKEN" >"$hotpath_token_tmp"
            chmod 600 "$hotpath_token_tmp"
            mv -f -- "$hotpath_token_tmp" "$HOTPATH_REPORTER_TOKEN_FILE"
            if [[ "$(stat -c '%a' "$HOTPATH_REPORTER_TOKEN_FILE")" != "600" ]] || \
              ! cmp -s <(printf '%s\n' "$E2E_HOTPATH_REPORTER_TOKEN") "$HOTPATH_REPORTER_TOKEN_FILE"; then
              echo "❌ Dedicated hotpath reporter token file verification failed"
              exit 1
            fi
            AFASASK_MONITOR_ENV_FILE="$SECRETS_DIR/afasask-monitor.env"
            if [[ ! -f "$AFASASK_MONITOR_ENV_FILE" ]]; then
              afasask_monitor_token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              {
                echo "AFASASK_MONITOR_TOKEN=${afasask_monitor_token}"
              } >"$AFASASK_MONITOR_ENV_FILE"
              chmod 600 "$AFASASK_MONITOR_ENV_FILE" || true
            fi
            AFASASK_MONITOR_TOKEN="$(grep -E '^AFASASK_MONITOR_TOKEN=' "$AFASASK_MONITOR_ENV_FILE" | head -n1 | cut -d= -f2-)"
            AFASASK_DEMO_USERNAME="$(grep -E '^AFASASK_DEMO_USERNAME=' "$AFASASK_MONITOR_ENV_FILE" | head -n1 | cut -d= -f2-)"
            AFASASK_DEMO_PASSWORD="$(grep -E '^AFASASK_DEMO_PASSWORD=' "$AFASASK_MONITOR_ENV_FILE" | head -n1 | cut -d= -f2-)"
            if [[ -z "${AFASASK_MONITOR_TOKEN:-}" ]]; then
              echo "❌ Missing AFASASK_MONITOR_TOKEN in $AFASASK_MONITOR_ENV_FILE"
              exit 1
            fi
            if [[ -z "${AFASASK_DEMO_USERNAME:-}" || -z "${AFASASK_DEMO_PASSWORD:-}" ]]; then
              echo "❌ Missing AFASASK_DEMO_USERNAME or AFASASK_DEMO_PASSWORD in $AFASASK_MONITOR_ENV_FILE"
              exit 1
            fi

            if docker ps -a --format '{{.Names}}' | grep -qx "$OLD_NAME"; then
              old_image="$(docker inspect "$OLD_NAME" --format '{{.Config.Image}}' || true)"
              echo "Found legacy container '$OLD_NAME' image=$old_image"
              if [[ "$old_image" == monitoring-system:* || "$old_image" == monitoring-system || "$old_image" == service-monitoring:* || "$old_image" == service-monitoring ]]; then
                echo "🛑 Stopping legacy container: $OLD_NAME"
                docker stop "$OLD_NAME" || true
                docker rm "$OLD_NAME" || true
              else
                echo "⚠️ Refusing to stop '$OLD_NAME' (unexpected image: $old_image)"
              fi
            fi

            stop_rm_if_exists "$APP_NAME"
            stop_rm_if_exists "$REGISTRY_NAME"
            stop_rm_if_exists "$RUNNER_NAME"
            stop_rm_if_exists "$DB_MONITOR_NAME"
            stop_rm_if_exists "$DOMAIN_EVENT_NAME"
            stop_rm_if_exists "$SCHEDULER_OBSERVER_NAME"

            echo "🚀 Starting e2e-registry..."
            docker run -d \
              --name "$REGISTRY_NAME" \
              --restart unless-stopped \
              --init \
              --network "$NET_NAME" \
              -p 127.0.0.1:8111:8111 \
              -v service-monitoring-state:/monitor_state:ro \
              -v e2e-registry-data:/data \
              -v e2e-artifacts:/artifacts \
              --env-file "$E2E_ENV_FILE" \
              -e E2E_REGISTRY_DISPATCH_ENABLED="0" \
              -e E2E_REGISTRY_HOST="0.0.0.0" \
              -e SERVICE_MONITOR_STATE_PATH="/monitor_state/state.json" \
              -e DATABASE_DEPENDENCY_STATE_PATH="/monitor_state/database-dependencies.json" \
              -e PITCHAI_MONITORING_EVENT_BUS_URL="https://pitchai.net/events-bus/webhooks/pitchai-monitoring" \
              -e PITCHAI_MONITORING_EVENT_BUS_SECRET="${EVENT_BUS_SECRET}" \
              -e PITCHAI_MONITORING_ENVIRONMENT="production" \
              -e PITCHAI_MONITORING_INSTANCE="pitchai-main-hotpaths" \
              -e PITCHAI_MONITORING_DEPLOYMENT_SHA="${{ github.sha }}" \
              -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
              "$IMAGE_SHA" \
              python -m e2e_registry.server

            echo "🚀 Starting e2e-runner..."
            docker run -d \
              --name "$RUNNER_NAME" \
              --restart unless-stopped \
              --init \
              --shm-size 1g \
              --network "$NET_NAME" \
              -v e2e-artifacts:/artifacts \
              -v e2e-registry-data:/data:ro \
              --env-file "$E2E_ENV_FILE" \
              --env-file "$AFASASK_MONITOR_ENV_FILE" \
              -e E2E_REGISTRY_BASE_URL="http://${REGISTRY_NAME}:8111" \
              -e E2E_REGISTRY_DISPATCH_ENABLED="0" \
              -e E2E_RUNNER_POLL_SECONDS="5" \
              -e E2E_RUNNER_CONCURRENCY="1" \
              -e E2E_RUNNER_TRACE_ON_FAILURE="0" \
              "$IMAGE_SHA" \
              python -m e2e_runner.main

            echo "🚀 Starting service-monitoring..."
            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              --init \
              --shm-size 1g \
              --network "$NET_NAME" \
              -v service-monitoring-state:/data \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /var/log/nginx:/var/log/nginx:ro \
              -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -e STATE_PATH="/data/state.json" \
              -e E2E_REGISTRY_BASE_URL="http://${REGISTRY_NAME}:8111" \
              -e E2E_REGISTRY_MONITOR_TOKEN="${E2E_MONITOR_TOKEN}" \
              -e AFASASK_MONITOR_TOKEN="${AFASASK_MONITOR_TOKEN}" \
              "$IMAGE_SHA"

            echo "🚀 Starting domain incident Events Bus producer..."
            docker run -d \
              --name "$DOMAIN_EVENT_NAME" \
              --restart unless-stopped \
              --init \
              --network "$NET_NAME" \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              -v service-monitoring-state:/data \
              -e PYTHONDONTWRITEBYTECODE="1" \
              -e STATE_PATH="/data/state.json" \
              -e DOMAIN_INCIDENT_EVENT_STATE_PATH="/data/domain-incident-events.json" \
              -e PITCHAI_MONITORING_EVENT_BUS_URL="https://pitchai.net/events-bus/webhooks/pitchai-monitoring" \
              -e PITCHAI_MONITORING_EVENT_BUS_SECRET="${EVENT_BUS_SECRET}" \
              -e PITCHAI_MONITORING_ENVIRONMENT="production" \
              -e PITCHAI_MONITORING_INSTANCE="pitchai-main-domain-incidents" \
              -e PITCHAI_MONITORING_DEPLOYMENT_SHA="${{ github.sha }}" \
              "$IMAGE_SHA" \
              python -m monitoring_v2.domain_event_sidecar

            echo "🚀 Starting scheduler placement incident observer..."
            docker run -d \
              --name "$SCHEDULER_OBSERVER_NAME" \
              --restart unless-stopped \
              --init \
              --network host \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=8m \
              -v service-monitoring-state:/data \
              -e PITCHAI_PLATFORM_CENTRAL_URL \
              -e PITCHAI_PLATFORM_USER_TOKEN \
              -e PYTHONDONTWRITEBYTECODE="1" \
              -e SCHEDULER_INCIDENT_STATE_PATH="/data/scheduler-placement-observer.json" \
              -e SCHEDULER_INCIDENT_POLL_SECONDS="15" \
              -e PITCHAI_MONITORING_EVENT_BUS_URL="https://pitchai.net/events-bus/webhooks/pitchai-monitoring" \
              -e PITCHAI_MONITORING_EVENT_BUS_SECRET="${EVENT_BUS_SECRET}" \
              -e PITCHAI_MONITORING_ENVIRONMENT="production" \
              -e PITCHAI_MONITORING_INSTANCE="pitchai-main-scheduler-observer" \
              -e PITCHAI_MONITORING_DEPLOYMENT_SHA="${{ github.sha }}" \
              "$IMAGE_SHA" \
              python -m monitoring_v2.scheduler_incident_observer
            unset PITCHAI_PLATFORM_CENTRAL_URL PITCHAI_PLATFORM_USER_TOKEN

            echo "🚀 Starting database dependency monitor..."
            docker run -d \
              --name "$DB_MONITOR_NAME" \
              --restart unless-stopped \
              --init \
              --network "$NET_NAME" \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              -v service-monitoring-state:/data \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v /etc/nginx/conf.d:/routing/nginx-conf:ro \
              -e PYTHONDONTWRITEBYTECODE="1" \
              -e DATABASE_DEPENDENCY_STATE_PATH="/data/database-dependencies.json" \
              -e PITCHAI_MONITORING_EVENT_BUS_URL="https://pitchai.net/events-bus/webhooks/pitchai-monitoring" \
              -e PITCHAI_MONITORING_EVENT_BUS_SECRET="${EVENT_BUS_SECRET}" \
              -e PITCHAI_MONITORING_ENVIRONMENT="production" \
              -e PITCHAI_MONITORING_INSTANCE="pitchai-main-database-dependencies" \
              -e PITCHAI_MONITORING_DEPLOYMENT_SHA="${{ github.sha }}" \
              -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
              "$IMAGE_SHA" \
              python -m monitoring_v2.main

            echo "⏳ Waiting for startup..."
            sleep 10

            assert_container_stable() {
              local name="$1"
              local running restarting restart_count
              running="$(docker inspect "$name" --format '{{.State.Running}}')"
              restarting="$(docker inspect "$name" --format '{{.State.Restarting}}')"
              restart_count="$(docker inspect "$name" --format '{{.RestartCount}}')"
              if [[ "$running" != "true" || "$restarting" != "false" || "$restart_count" != "0" ]]; then
                echo "❌ Container failed stability check: $name"
                docker logs "$name" --tail 200 || true
                exit 1
              fi
            }

            for stability_check in 1 2; do
              for name in "$REGISTRY_NAME" "$RUNNER_NAME" "$APP_NAME" "$DB_MONITOR_NAME" "$DOMAIN_EVENT_NAME" "$SCHEDULER_OBSERVER_NAME"; do
                assert_container_stable "$name"
              done
              if [[ "$stability_check" == "1" ]]; then
                sleep 10
              fi
            done

            docker exec "$APP_NAME" python -c \
              'from domain_checks.event_bus import load_event_bus_config; assert load_event_bus_config() is None'
            docker exec "$REGISTRY_NAME" python -c \
              'from domain_checks.event_bus import load_event_bus_config; assert load_event_bus_config() is not None'
            docker exec "$DOMAIN_EVENT_NAME" python -c \
              'from domain_checks.event_bus import load_event_bus_config; assert load_event_bus_config() is not None'
            docker exec "$SCHEDULER_OBSERVER_NAME" python -c \
              'from domain_checks.event_bus import load_event_bus_config; from monitoring_v2.scheduler_incident_feed import load_scheduler_incident_feed_config; assert load_event_bus_config() is not None; load_scheduler_incident_feed_config()'
            docker exec "$DB_MONITOR_NAME" python -c \
              'from domain_checks.event_bus import load_event_bus_config; assert load_event_bus_config() is not None'
            docker exec "$REGISTRY_NAME" python -c \
              'import os; assert len(os.environ.get("E2E_HOTPATH_REPORTER_TOKEN", "")) >= 32'

            echo "⏳ Waiting for the domain incident producer to bootstrap and drain..."
            domain_event_ready="false"
            for attempt in $(seq 1 36); do
              if docker exec "$DOMAIN_EVENT_NAME" python -c \
                'import json; from pathlib import Path; state=json.loads(Path("/data/domain-incident-events.json").read_text()); producer=state["producer"]; assert state["version"] == 1; assert producer["status"] == "healthy"; assert producer["bootstrapped"] is True; assert producer["last_error"] is None; assert producer["pending_count"] == 0' \
                >/dev/null 2>&1; then
                domain_event_ready="true"
                break
              fi
              sleep 5
            done
            if [[ "$domain_event_ready" != "true" ]]; then
              echo "❌ Domain incident producer did not bootstrap and drain"
              docker logs "$DOMAIN_EVENT_NAME" --tail 200 || true
              exit 1
            fi

            echo "⏳ Waiting for the scheduler observer to complete an authenticated central poll..."
            scheduler_observer_ready="false"
            for attempt in $(seq 1 36); do
              if docker exec "$SCHEDULER_OBSERVER_NAME" python -c \
                'import json; from pathlib import Path; state=json.loads(Path("/data/scheduler-placement-observer.json").read_text()); assert state["version"] == 1; assert state["bootstrapped"] is True; assert state["last_error"] is None; assert state["last_successful_poll_at_ts"] > 0; assert state["last_successful_directory_poll_at_ts"] > 0; assert isinstance(state["cells"], dict); assert isinstance(state["event_bus_outbox"], list)' \
                >/dev/null 2>&1; then
                scheduler_observer_ready="true"
                break
              fi
              sleep 5
            done
            if [[ "$scheduler_observer_ready" != "true" ]]; then
              echo "❌ Scheduler placement observer did not complete a healthy poll"
              docker logs "$SCHEDULER_OBSERVER_NAME" --tail 200 || true
              exit 1
            fi

            echo "⏳ Waiting for the first database dependency snapshot..."
            db_snapshot_ready="false"
            for attempt in $(seq 1 36); do
              if docker exec "$DB_MONITOR_NAME" python -c \
                'import json; from pathlib import Path; state=json.loads(Path("/data/database-dependencies.json").read_text()); assert state["version"] == 2; assert state["collector"]["status"] == "healthy"; assert state["generated_at_ts"] > 0; assert len(state["dependencies"]) > 0' \
                >/dev/null 2>&1; then
                db_snapshot_ready="true"
                break
              fi
              sleep 5
            done
            if [[ "$db_snapshot_ready" != "true" ]]; then
              echo "❌ Database dependency monitor did not produce a healthy v2 snapshot"
              docker logs "$DB_MONITOR_NAME" --tail 200 || true
              exit 1
            fi

            echo "🌐 Verifying the live dashboard contract..."
            expected_domain_count="$(
              docker exec "$REGISTRY_NAME" python -c \
                'from monitoring_v2.deploy_contract import production_domain_count; print(production_domain_count())'
            )"
            if [[ ! "$expected_domain_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "❌ Invalid production domain count: $expected_domain_count"
              exit 1
            fi
            docker exec -i \
              -e MONITORING_DASHBOARD_BASE_URL="http://127.0.0.1:8111" \
              -e MONITORING_DASHBOARD_IDENTITY="info@pitchai.net" \
              -e MONITORING_DASHBOARD_EXPECTED_SHA="${{ github.sha }}" \
              -e MONITORING_DASHBOARD_EXPECTED_DOMAINS="$expected_domain_count" \
              -e MONITORING_DASHBOARD_EXPECTED_GROUPS="16" \
              "$REGISTRY_NAME" \
              node - < scripts/verify-live-dashboard.cjs

            echo "✅ Containers running"
            docker ps --filter "name=${APP_NAME}|${REGISTRY_NAME}|${RUNNER_NAME}|${DB_MONITOR_NAME}|${DOMAIN_EVENT_NAME}|${SCHEDULER_OBSERVER_NAME}"
            docker logs "$REGISTRY_NAME" --tail 40 || true
            docker logs "$RUNNER_NAME" --tail 40 || true
            docker logs "$APP_NAME" --tail 80 || true
            docker logs "$DB_MONITOR_NAME" --tail 80 || true
            docker logs "$DOMAIN_EVENT_NAME" --tail 80 || true
            docker logs "$SCHEDULER_OBSERVER_NAME" --tail 80 || true

            cd /
            rm -rf "$DEPLOY_DIR"
