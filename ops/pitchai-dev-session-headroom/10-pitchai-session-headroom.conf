# Install as /etc/systemd/logind.conf.d/10-pitchai-session-headroom.conf
#
# A backlog of stuck "closing" sessions must never be able to refuse new
# logins before the reaper clears it. The default ceiling (8192) was reached on
# 2026-09-21 by ~8180 dead sessions; the 8x headroom below keeps logind session
# management available for the whole time the reaper needs to run.
[Login]
SessionsMax=65536
