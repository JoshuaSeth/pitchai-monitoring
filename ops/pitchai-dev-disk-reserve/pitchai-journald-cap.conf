# Install as /etc/systemd/journald.conf.d/10-pitchai-cap.conf
#
# journald is unconfigured on pitchai-dev, so it inherits the built-in defaults
# (cap journald at 10% of the filesystem, i.e. tens of GiB here) and treats the
# root filesystem as free space to consume. Cap it, and let it trim itself as
# soon as the root filesystem runs tight, which is when the demo Postgres needs
# every megabyte it can get.
[Journal]
SystemMaxUse=1G
SystemKeepFree=2G
